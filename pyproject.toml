[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dhcpt"
version = "0.1.1"
description = "Comprehensive DHCP tester, troubleshooting, and diagnostic CLI utility with DHCP relay agent and IP-helper simulation."
readme = "README.md"
license = "GPL-2.0-or-later"
authors = [
    { name = "Emilian Schweikert" },
]
maintainers = [
    { name = "Emilian Schweikert" },
]
keywords = [
    "dhcp",
    "network",
    "relay",
    "cisco",
    "juniper",
    "ip-helper",
    "diagnostics",
    "troubleshooting",
    "scapy",
    "sysadmin",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
]
requires-python = ">=3.9"
dependencies = [
    "scapy>=2.5.0",
]

[project.urls]
Homepage = "https://github.com/epicade/dhcpt"
Repository = "https://github.com/epicade/dhcpt"
Issues = "https://github.com/epicade/dhcpt/issues"

[project.scripts]
dhcpt = "dhcpt.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/dhcpt"]

[tool.hatch.build.targets.wheel.force-include]
"completions" = "dhcpt/completions"
"skills" = "dhcpt/skills"

[tool.hatch.build.targets.wheel.shared-data]
"man/dhcpt.1" = "share/man/man1/dhcpt.1"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/completions",
    "/skills",
    "/man",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]
