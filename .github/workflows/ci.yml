name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-shell-and-docs:
    name: Lint Shell & Manpage
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect Pandoc version from committed manpage
        id: pandoc-version
        run: |
          VERSION=$(grep -oE 'Automatically generated by Pandoc [0-9.]+' man/dhcpt.1 | awk '{print $NF}')
          if [ -z "$VERSION" ]; then VERSION="3.7.0.2"; fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Detected Pandoc version from man/dhcpt.1: ${VERSION}"

      - name: Set up Pandoc
        uses: pandoc/actions/setup@v1
        with:
          version: ${{ steps.pandoc-version.outputs.version }}

      - name: Install development dependencies via Makefile (make install-dev)
        run: sudo make install-dev

      - name: Run Full Lint Suite (make lint)
        run: make lint

  test-enterprise-linux:
    name: Test (AlmaLinux 9 / Python 3.9)
    runs-on: ubuntu-latest
    container:
      image: almalinux:9
    steps:
      - name: Optimize DNF and install base tools
        run: |
          echo -e "fastestmirror=True\nmax_parallel_downloads=10\ninstall_weak_deps=False" >> /etc/dnf/dnf.conf
          dnf install -y git-core make python3-pip gcc python3-devel

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install package and test dependencies
        run: python3 -m pip install -e .[dev]

      - name: Run Pytest Test Suite via Makefile
        run: make test

  test-ubuntu:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dependencies
        run: python3 -m pip install -e .[dev]

      - name: Run Pytest Test Suite via Makefile
        run: make test

  e2e-live-kea:
    name: Live Network E2E (Kea DHCPv4 in Namespaces)
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install testbed system and python dependencies via Makefile (make install-dev)
        run: sudo make install-dev

      - name: Install dhcpt globally via make install
        run: sudo make install

      - name: Verify global installation, manpage, and shell completions
        run: |
          set -e
          test -x /usr/local/bin/dhcpt || { echo "[ERROR] /usr/local/bin/dhcpt is not installed or not executable!" >&2; exit 1; }
          test "$(which dhcpt)" = "/usr/local/bin/dhcpt" || { echo "[ERROR] 'which dhcpt' expected '/usr/local/bin/dhcpt', got '$(which dhcpt)'!" >&2; exit 1; }
          test "$(sudo which dhcpt)" = "/usr/local/bin/dhcpt" || { echo "[ERROR] 'sudo which dhcpt' expected '/usr/local/bin/dhcpt', got '$(sudo which dhcpt)'!" >&2; exit 1; }
          test -f /usr/local/share/man/man1/dhcpt.1 || { echo "[ERROR] Missing installed manpage in /usr/local/share/man/man1/dhcpt.1!" >&2; exit 1; }
          test -f /usr/local/share/bash-completion/completions/dhcpt || { echo "[ERROR] Missing installed bash completion in /usr/local/share/bash-completion/completions/dhcpt!" >&2; exit 1; }
          test -f /usr/local/share/zsh/site-functions/_dhcpt || { echo "[ERROR] Missing installed zsh completion in /usr/local/share/zsh/site-functions/_dhcpt!" >&2; exit 1; }
          /usr/local/bin/dhcpt --version || { echo "[ERROR] Failed executing /usr/local/bin/dhcpt --version!" >&2; exit 1; }
          sudo dhcpt --version || { echo "[ERROR] Failed executing sudo dhcpt --version!" >&2; exit 1; }
          man_path=$(man -w -M /usr/local/share/man dhcpt)
          test "$(readlink -f "$man_path")" = "$(readlink -f /usr/local/share/man/man1/dhcpt.1)" || { echo "[ERROR] man resolution expected to resolve to /usr/local/share/man/man1/dhcpt.1, got '$man_path'!" >&2; exit 1; }

      - name: Start Live Kea Testbed (make testbed-start)
        run: |
          sudo make testbed-start

      - name: Run Live E2E Tests (make testbed-run)
        run: |
          sudo make testbed-run

      - name: Stop Live Kea Testbed (make testbed-stop)
        if: always()
        run: |
          sudo make testbed-stop
