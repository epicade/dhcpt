name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-shell-and-docs:
    name: Lint Shell & Manpage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (ShellCheck, Zsh, Groff, man-db)
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck zsh groff man-db

      - name: Validate Bash Completion with ShellCheck and Syntax
        run: |
          shellcheck completions/bash/dhcpt
          bash -o noexec completions/bash/dhcpt

      - name: Validate Zsh Completion Syntax and Runtime Loading
        run: |
          zsh --noexec completions/zsh/_dhcpt
          zsh -f -c 'autoload -Uz compinit && compinit -D && source completions/zsh/_dhcpt'

      - name: Validate UNIX Manpage Formatting
        run: |
          man -l man/dhcpt.1 > /dev/null

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[dev]

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Ruff Formatter Check
        run: ruff format --check .

      - name: Run Pytest Test Suite
        run: PYTHONPATH=src pytest -v
